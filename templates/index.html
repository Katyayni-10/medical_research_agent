<!DOCTYPE html>
<html>
<head>
    <title>Medical Research Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
</head>
<body>
    <!-- <div class="overlay"> -->
    <div class="container">
        <h1>MANI(Medical Research Assistant)</h1>
        <p1 class="subtitle">Powered by LangGraph • Groq • Wikipedia • PubMed</p1>
        <!-- <form action="/analyze" method="POST"> -->
        <form action="/analyze" method="POST">
            <!-- <input type="text" name="query" placeholder="Ask any medical question....." required> -->
            <textarea name="query" placeholder="Describe symptoms or ask a medical question....." required></textarea>
            <button>Analyze</button>
        </form>
        {% if analysis %}
        <div class="result">
            <!-- <h2>Report</h2>
            <pre>{{analysis}}</pre> -->
            {{ analysis|safe }}
        </div>
        {% endif %}
    </div>
    <!-- </div> -->
</body>
</html>
