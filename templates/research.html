{% extends "base.html" %}
{% block title %}
Medical research
{% endblock %}

{% block content %}
<div class="page-container">
    <div class="page-header">
        <h1>Medical Research Agent</h1>
        <p>Ask medical questions on the go</p>
    </div>
    <form action="{{url_for('research')}}" method="POST">
        <textarea name="query" placeholder="Ask a medical question..." required></textarea>
        <button type="submit">Analyze</button>
    </form>
    {% if analysis %}
    <div class="result">
        <h2>Analysis</h2>
        <div class="analysis-text">{{analysis | safe }}</div>
    </div>
    {% endif %}
</div>
{% endblock %}
